<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>农历日历</title>
  <meta name="description" content="显示公历日期与对应农历、节气、节日的日历">
  <meta name="theme-color" content="#b23a2e" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1a19" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="农历">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="today" id="detail" aria-live="polite">
      <div class="today-solar">
        <span class="today-day" id="d-day"></span>
        <div class="today-meta">
          <div id="d-ym"></div>
          <div id="d-week"></div>
        </div>
      </div>
      <div class="today-lunar" id="d-lunar"></div>
      <div class="today-gz" id="d-gz"></div>
      <div class="today-tags" id="d-tags"></div>
    </section>

    <section class="calendar">
      <header class="cal-head">
        <button class="nav" id="prev" aria-label="上个月">‹</button>
        <button class="title" id="title" aria-label="选择年月" aria-haspopup="true"></button>
        <button class="nav" id="next" aria-label="下个月">›</button>
      </header>
      <div class="weekdays">
        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="we">六</span><span class="we">日</span>
      </div>
      <div class="grid" id="grid" role="grid"></div>
      <button class="back-today" id="back-today" hidden>回到今天</button>

      <div class="picker" id="picker" hidden role="dialog" aria-label="选择年月">
        <header class="cal-head">
          <button class="nav" id="p-prev" aria-label="上一页">‹</button>
          <button class="title" id="p-title"></button>
          <button class="nav" id="p-next" aria-label="下一页">›</button>
        </header>
        <div class="picker-grid" id="p-grid"></div>
        <div class="picker-foot">
          <button id="p-today">今天</button>
          <button id="p-close">取消</button>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
